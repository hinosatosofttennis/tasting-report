<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍷 ワインテイスティング記録アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>ワインテイスティング記録</h1>
    </header>

    <main>
        <div class="tab-controls">
            <button id="record-tab" class="active">📝 新規記録</button>
            <button id="list-tab">📋 記録リスト</button>
        </div>

        <section id="record-area" class="active">
            <h2>テイスティング記録 (新規)</h2>
            <form id="tasting-form">

                <fieldset class="basic-info-group">
                    <legend>基本情報</legend>

                    <div class="form-row">
                        <label for="wine-name">ワイン名 (タイトル)</label>
                        <input type="text" id="wine-name" name="wineName" required>
                    </div>

                    <div class="form-row">
                        <label for="recorder-name">記録者名</label>
                        <input type="text" id="recorder-name" name="recorderName" required>
                    </div>

                    <div class="form-row">
                        <label for="record-date">記録日時</label>
                        <input type="datetime-local" id="record-date" name="recordDate" required>
                    </div>

                    <div class="form-row">
                        <label for="free-text">自由記入欄 (100字まで)</label>
                        <textarea id="free-text" name="freeText" maxlength="100"></textarea>
                    </div>
                </fieldset>

                <div class="wine-type-toggle">
                    <button type="button" id="toggle-white" data-type="white" class="active">🥂 白ワイン</button>
                    <button type="button" id="toggle-red" data-type="red">🍷 赤ワイン</button>
                </div>

                <fieldset class="photo-upload-group">
                    <legend>写真追加 (2〜4枚)</legend>
                    <input type="file" id="wine-photos" name="winePhotos" accept="image/*" multiple>
                    <p class="file-limit-note">※最大4枚まで選択可能です。</p>
                    <div id="photo-preview-container" class="preview-container">
                        <p>選択された写真がここに表示されます。</p>
                    </div>
                </fieldset>
                
                 <fieldset class="wine-selection">
                    <legend>追加情報</legend>                
                <div class="wine-selection">
                    <button type="button" onclick="selectWineType('white')" class="active">白ワイン</button>
                    <button type="button" onclick="selectWineType('red')">赤ワイン</button>
                    </div>
                <div id="basic-info-area" style="display: none; margin-top: 10px; padding: 15px; border: 5px solid #ccc;">
                    <div class="form-group">
                        <label>収穫年</label>
                        <input type="text" id="vintage-input" placeholder="例: 2023" maxlength="4" pattern="\d{4}" inputmode="numeric">
                        </div>
                    <div class="form-group">
                        <label>生産地</label>
                        <select id="country-select">
                            <option value="">選択してください</option>
                            <option value="フランス">フランス</option>
                            <option value="イタリア">イタリア</option>
                            <option value="スペイン">スペイン</option>
                            <option value="アメリカ">アメリカ</option>
                            <option value="チリ">チリ</option>
                            <option value="オーストラリア">オーストラリア</option>
                            <option value="日本">日本</option>
                            <option value="その他">その他</option>
                            </select>
                        </div>
                    <div class="form-group">
                        <label>主なブドウ品種</label>
                        <select id="grape-select">
                            <option value="">先にワインの種類を選んでください</option>
                            </select>
                        </div>
                    </div>
                     </fieldset>
                
                <div id="tasting-sections">
                    <p class="placeholder-text">ワインタイプを選択してください。</p>
                </div>
                
                <button type="submit" id="save-record-btn">💾 記録を保存</button>
            </form>
        </section>

        <section id="list-area" class="hidden">
            <h2>記録リスト</h2>
            <div id="list-controls">
                <button id="export-data-btn">📤 データ書き出し (CSV/JSON)</button>
            </div>
            <table id="tasting-list-table">
                <thead>
                    <tr>
                        <th>日時</th>
                        <th>記録者</th>
                        <th>ワイン名</th>
                        <th>タイプ</th>
                        <th>コメント要約</th>
                        <th>写真</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="list-body">
                    </tbody>
            </table>
        </section>
    </main>

    <div id="detail-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>テイスティング記録 詳細</h2>
            <div id="detail-content">
                </div>
        </div>
    </div>
    
    <script src="data/white_wine_data.js"></script>
    <script src="data/red_wine_data.js"></script>
    <script src="script.js"></script>
    <script>
  // 品種リストのデータ定義
  const grapeVarieties = {
    red: [
      "カベルネ・ソーヴィニヨン",
      "ピノ・ノワール",
      "メルロ",
      "シラー／シラーズ",
      "カベルネ・フラン",
      "グルナッシュ",
      "サンジョヴェーゼ",
      "ネッビオーロ",
      "テンプラニーリョ",
      "マスカット・ベーリーA",
      "その他"
    ],
    white: [
      "シャルドネ",
      "ソーヴィニヨン・ブラン",
      "リースリング",
      "甲州",
      "シュナン・ブラン",
      "ゲヴュルツトラミネール",
      "ヴィオニエ",
      "セミヨン",
      "ピノ・グリ",
      "ミュスカデ",
      "その他"
    ]
  };

  /**
   * ワインの種類が選ばれたときに実行する関数
   * @param {string} type - 'red' または 'white'
   */
  function selectWineType(type) {
    // 1. 入力エリアを表示する
    document.getElementById('basic-info-area').style.display = 'block';

    // 2. ブドウ品種のセレクトボックスを取得
    const grapeSelect = document.getElementById('grape-select');

    // 3. 今ある選択肢を一度リセット（空にする）
    grapeSelect.innerHTML = '<option value="">選択してください</option>';

    // 4. 選ばれたタイプ（red/white）に応じたリストを取得
    const list = grapeVarieties[type];

    // 5. リストをループして <option> タグを追加していく
    list.forEach(grape => {
      const option = document.createElement('option');
      option.value = grape;
      option.textContent = grape;
      grapeSelect.appendChild(option);
    });
    
    // (オプション) 現在どちらが選ばれているか分かりやすくログ出し
    console.log(type === 'red' ? "赤ワイン選択中" : "白ワイン選択中");
  }
    </script>
</body>
</html>
